# Copie para 11-secret.yaml (gitignored), preencha os valores e aplique:
#   cp k8s/11-secret.example.yaml k8s/11-secret.yaml
#   # edite k8s/11-secret.yaml
#   kubectl apply -f k8s/11-secret.yaml
#
# IMPORTANTE: SPRING_DATASOURCE_PASSWORD e POSTGRES_PASSWORD devem ter o MESMO valor
# (a app autentica no banco com a senha que o Postgres foi inicializado).
apiVersion: v1
kind: Secret
metadata:
  name: oficina-secret
  namespace: oficina
  labels:
    app.kubernetes.io/part-of: oficina
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME_db_password"
  POSTGRES_PASSWORD: "CHANGE_ME_db_password"
  APP_JWT_SECRET: "CHANGE_ME_troque-por-um-valor-longo-aleatorio"
  APP_SECURITY_ADMIN_PASSWORD: "CHANGE_ME_admin_password"
  # Vazio = notificações em modo no-op (a app tolera ausência da chave Resend).
  APP_RESEND_API_KEY: ""
