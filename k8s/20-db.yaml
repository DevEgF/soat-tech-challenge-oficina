apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oficina-db-pvc
  namespace: oficina
  labels:
    app.kubernetes.io/part-of: oficina
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-db
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-db
    app.kubernetes.io/part-of: oficina
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oficina-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-db
        app.kubernetes.io/part-of: oficina
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - configMapRef:
                name: oficina-db-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-secret
                  key: POSTGRES_PASSWORD
            # Subdiretório evita conflito do initdb com o lost+found do volume.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U oficina -d oficina"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U oficina -d oficina"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: oficina-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-db
  namespace: oficina
  labels:
    app.kubernetes.io/part-of: oficina
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oficina-db
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
